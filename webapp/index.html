<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Карельский гид</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"%3E%3Crect width="40" height="40" rx="11" fill="%2312232e"/%3E%3Cpath d="M20 4.2v2.6M18.9 5.3h2.2" stroke="%23e09a5f" stroke-width="1.1" stroke-linecap="round"/%3E%3Cpath d="M20 6.9c2.3 2 3.1 3.2 3.1 4.4a3.1 3.1 0 0 1-6.2 0c0-1.2.8-2.4 3.1-4.4zM18.6 14.3h2.8v2.2h-2.8zM13.6 22 20 16.2l6.4 5.8zM15 22h10v6.6H15z" fill="%23e09a5f"/%3E%3Cpath d="M18.6 28.6v-3.4a1.4 1.4 0 0 1 2.8 0v3.4z" fill="%2312232e"/%3E%3Cpath d="M7.5 32.4c2.1-1.3 4.2-1.3 6.3 0s4.2 1.3 6.2 0 4.2-1.3 6.3 0 4.1 1.3 6.2 0" fill="none" stroke="%236fa3b8" stroke-width="1.8" stroke-linecap="round"/%3E%3C/svg%3E">
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1c24" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="fonts/cormorant-700.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <rect width="40" height="40" rx="11" fill="#12232e"/>
          <path d="M20 4.2v2.6M18.9 5.3h2.2" stroke="#e09a5f" stroke-width="1.1" stroke-linecap="round"/>
          <path d="M20 6.9c2.3 2 3.1 3.2 3.1 4.4a3.1 3.1 0 0 1-6.2 0c0-1.2.8-2.4 3.1-4.4zM18.6 14.3h2.8v2.2h-2.8zM13.6 22 20 16.2l6.4 5.8zM15 22h10v6.6H15z" fill="#e09a5f"/>
          <path d="M18.6 28.6v-3.4a1.4 1.4 0 0 1 2.8 0v3.4z" fill="#12232e"/>
          <path d="M7.5 32.4c2.1-1.3 4.2-1.3 6.3 0s4.2 1.3 6.2 0 4.2-1.3 6.3 0 4.1 1.3 6.2 0" fill="none" stroke="#6fa3b8" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="brand-title">Карельский гид</div>
          <div class="brand-sub" id="modeLabel">голосовой путеводитель</div>
        </div>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab active" role="tab" data-tab="chat" aria-selected="true">Гид</button>
        <button class="tab" role="tab" data-tab="map" aria-selected="false">Карта</button>
      </nav>
    </header>

    <main class="screens">
      <section class="screen active" id="screen-chat" aria-label="Разговор с гидом">
        <div class="messages" id="messages">
          <div class="welcome" id="welcome">
            <svg class="welcome-art" viewBox="0 0 320 120" aria-hidden="true">
              <defs>
                <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="var(--lake)" stop-opacity=".2"/>
                  <stop offset="1" stop-color="var(--lake)" stop-opacity=".03"/>
                </linearGradient>
              </defs>
              <rect width="320" height="120" rx="22" fill="url(#sky)"/>
              <circle cx="252" cy="34" r="13" fill="var(--sun)"/>
              <path d="M0 78c40-14 70-16 110-6s70 6 100-4 70-12 110 2v50H0z" fill="var(--lake)" opacity=".22"/>
              <path d="M0 92c50-10 90-8 130 0s80 6 120-2 50-4 70 0v30H0z" fill="var(--lake)" opacity=".34"/>
              <g fill="var(--pine)">
                <path d="M38 88 50 52l12 36z"/><path d="M58 90 68 62l10 28z"/><path d="M24 92l8-24 8 24z"/>
                <path d="M262 90l10-30 10 30z"/><path d="M280 92l8-22 8 22z"/>
              </g>
              <g fill="var(--accent)">
                <path d="M150 86h22V70h-22z"/><path d="M147 71 161 58l14 13z"/>
                <path d="M157 58h8V48h-8z"/><circle cx="161" cy="45" r="4"/>
              </g>
            </svg>
            <h1>Спросите о Карелии</h1>
            <p>Нажмите на микрофон и задайте вопрос — отвечу голосом. Знаю про Кижи, Валаам, Рускеалу, Кивач и другие места.</p>
            <div class="chips" id="suggestions">
              <button class="chip">Как добраться до Кижей?</button>
              <button class="chip">Что посмотреть в Рускеале?</button>
              <button class="chip">Когда лучше ехать на Валаам?</button>
              <button class="chip">Маршрут на выходные</button>
              <button class="chip">Сколько стоит вход на Кивач?</button>
              <button class="chip">Что за сейды на Воттоваре?</button>
            </div>
          </div>
        </div>
      </section>

      <section class="screen" id="screen-map" aria-label="Карта Карелии">
        <div id="map"></div>
        <div class="place-strip" id="placeStrip"></div>
        <article class="sheet" id="sheet" hidden>
          <button class="sheet-close" id="sheetClose" aria-label="Закрыть">✕</button>
          <div class="sheet-head">
            <div class="sheet-emoji" id="sheetEmoji"></div>
            <div>
              <h2 id="sheetTitle"></h2>
              <div class="sheet-meta" id="sheetMeta"></div>
            </div>
          </div>
          <p id="sheetText"></p>
          <div class="sheet-actions">
            <button class="btn" id="sheetListen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>Послушать</button>
            <button class="btn" id="sheetAsk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17.5 3.5 21l4.2-1.6A9 8 0 1 0 5 17.5z"/></svg>Спросить</button>
            <button class="btn" id="sheetRoute"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Маршрут</button>
          </div>
          <div class="sheet-sources" id="sheetSources"></div>
        </article>
      </section>
    </main>

    <footer class="dock" id="dock">
      <div class="status" id="status">Нажмите на микрофон и говорите</div>
      <div class="voice-row" id="voiceRow">
        <button class="round ghost" id="toKeyboard" aria-label="Написать текстом">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h1M9.5 10h1M13 10h1M16.5 10h1M7 14h10"/></svg>
        </button>
        <button class="mic" id="mic" aria-label="Задать вопрос голосом">
          <span class="mic-ring"></span>
          <svg viewBox="0 0 24 24" class="mic-icon"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          <svg viewBox="0 0 24 24" class="stop-icon"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg>
        </button>
        <button class="round ghost" id="cancelRec" aria-label="Отменить запись" hidden>
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <button class="round ghost" id="stopAudio" aria-label="Остановить озвучку">
          <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
        </button>
      </div>
      <form class="text-row" id="textRow" hidden>
        <button type="button" class="round ghost" id="toVoice" aria-label="Говорить голосом">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        </button>
        <input id="textInput" type="text" maxlength="500" placeholder="Спросите о Карелии…" autocomplete="off" enterkeyhint="send">
        <button type="submit" class="round filled" id="send" aria-label="Отправить">
          <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </footer>
  </div>

  <div class="toast" id="toast" role="alert" hidden></div>
  <audio id="player" preload="none"></audio>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
